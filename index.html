  img{max-width:100%;display:block}
  [hidden]{display:none!important}

  #gate.hidden{display:none}
  #gate h1{font-family:var(--serif);font-weight:300;font-size:clamp(2.4rem,7vw,4rem);margin-bottom:.5rem}
  #gate p{color:#a8999a;max-width:30rem;margin:0 auto 2rem}
  .btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-block;padding:.85rem 2rem;border:1px solid var(--accent);color:var(--ink);background:transparent;
       font:500 .8rem var(--sans);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:.25s}
  .btn:hover{background:var(--accent);color:#fff}
  .btn.solid{background:var(--accent);color:#fff}
  .btn.solid:hover{filter:brightness(.88)}
  .btn.ghost{border-color:var(--line);color:var(--muted)}
  #gate .btn{color:#f3ece8}

  /* Header */
  header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;
         padding:.9rem 5vw;background:linear-gradient(var(--bg) 60%,transparent)}
  .logo{font-family:var(--serif);font-size:1.6rem;letter-spacing:.05em}
  nav{display:flex;gap:1.6rem;align-items:center}
  nav a{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);transition:.2s}
  nav a:hover{color:var(--ink)}
  .tools{display:flex;gap:.5rem}
  .tools button{background:transparent;border:1px solid var(--line);color:var(--ink);width:2.2rem;height:2.2rem;border-radius:50%;
                cursor:pointer;font:500 .7rem var(--sans);transition:.2s}
  .tools button:hover{border-color:var(--accent)}
  @media(max-width:900px){nav{display:none}header{justify-content:space-between}}
  #burger{display:none}
  @media(max-width:900px){#burger{display:block}}
  #mnav{position:fixed;inset:0;z-index:45;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem}
  #mnav.open{display:flex}
  #mnav a{font-family:var(--serif);font-size:2rem}

  /* Sections */
  section{padding:7rem 5vw 4rem;max-width:1200px;margin:auto}
  h2{font-family:var(--serif);font-weight:300;font-size:clamp(2rem,5vw,3.2rem);margin-bottom:.4rem}
  .sub{color:var(--muted);margin-bottom:2.5rem;max-width:40rem}
  .eyebrow{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent2);margin-bottom:1rem;display:block}
  #accueil{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:none;
           background:radial-gradient(ellipse at 70% 40%,var(--glow),transparent 55%),var(--bg)}
  #accueil .inner{max-width:1200px;margin:auto;width:100%}
  #accueil h1{font-family:var(--serif);font-weight:300;font-size:clamp(3rem,10vw,7rem);line-height:1;margin-bottom:1.2rem}
  #accueil h1 em{color:var(--accent);font-style:italic}
  #accueil p{max-width:34rem;color:var(--muted);margin-bottom:2rem;font-size:1.05rem}

  /* Grids & tiles */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.2rem}
  .tile{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--card);cursor:pointer;border:1px solid var(--line)}
  .tile img,.tile .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s,filter .4s}
  .tile:hover img,.tile:hover .ph{transform:scale(1.05)}
  .ph{display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;color:rgba(255,255,255,.4);font-size:1.1rem}
  .cap{position:absolute;left:0;right:0;bottom:0;padding:2.5rem 1rem 1rem;background:linear-gradient(transparent,rgba(0,0,0,.82));
       font-family:var(--serif);font-size:1.15rem;color:#f3ece8}
  .cap small{display:block;font:300 .72rem var(--sans);color:#c8b9ba;letter-spacing:.1em}
  .mature img,.mature .ph{filter:blur(22px) saturate(.8)}
  .mature.revealed img,.mature.revealed .ph{filter:none}
  .lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;
        font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:#fff;z-index:2;transition:opacity .3s}
  .lock b{font-size:1.6rem}
  .mature.revealed .lock{opacity:0;pointer-events:none}

  /* Filtres & séries */
  .chips{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.8rem}
  .chip{padding:.4rem 1.1rem;border:1px solid var(--line);border-radius:99px;font-size:.78rem;letter-spacing:.08em;cursor:pointer;color:var(--muted);background:transparent;font-family:var(--sans)}
  .chip.on,.chip:hover{border-color:var(--accent);color:var(--ink)}
  .chip.on{background:var(--accent);color:#fff}
  .serie-card{aspect-ratio:16/10}
  #seriePage{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding:5rem 5vw 4rem}
  #seriePage .inner{max-width:1200px;margin:auto}
  .back{cursor:pointer;color:var(--accent2);font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:1.5rem;display:inline-block;background:none;border:0;font-family:var(--sans)}

  /* Boutique */
  .shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.4rem}
  .prod{border:1px solid var(--line);background:var(--bg2)}
  .prod .pic{aspect-ratio:1/1;position:relative}
  .prod .pic .ph,.prod .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .prod .body{padding:1.1rem 1.2rem 1.4rem}
  .prod h3{font-family:var(--serif);font-weight:500;font-size:1.35rem}
  .prod p{color:var(--muted);font-size:.9rem;margin:.2rem 0 .9rem}
  .prod .row{display:flex;justify-content:space-between;align-items:center}
  .price{font-family:var(--serif);font-size:1.4rem;color:var(--accent2)}
  .sold{opacity:.6}
  .note{color:var(--muted);font-size:.8rem;margin-top:1.2rem}

  /* Journal */
  .journal{display:grid;gap:1px;background:var(--line)}
  .entry{background:var(--bg);padding:1.8rem 0;display:grid;grid-template-columns:140px 1fr;gap:2rem}
  .entry time{font-family:var(--serif);font-size:1.1rem;color:var(--accent2)}
  .entry h3{font-family:var(--serif);font-weight:500;font-size:1.5rem;margin-bottom:.3rem}
  .entry p{color:var(--muted)}
  @media(max-width:600px){.entry{grid-template-columns:1fr;gap:.3rem}}

  .two{display:grid;grid-template-columns:1fr 1.3fr;gap:3rem;align-items:center}
  .portrait{aspect-ratio:4/5;background:var(--card);border:1px solid var(--line);position:relative}
  .portrait img{width:100%;height:100%;object-fit:cover}
  @media(max-width:760px){.two{grid-template-columns:1fr}}
  form{display:grid;gap:1rem;max-width:34rem}
  input,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);padding:.9rem 1rem;font:300 1rem var(--sans)}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .links{display:flex;gap:1.5rem;flex-wrap:wrap;margin-top:1.8rem}
  .links a{border-bottom:1px solid var(--accent);padding-bottom:2px;font-size:.85rem;letter-spacing:.1em}
  footer{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:.78rem;border-top:1px solid var(--line)}

  back:"← Back",serieEye:"Series",placeholder:"Your image",open:"Open",lock:"Click to view",subject:"Message from the website"}
};

/* ============================ Code ============================ */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
let lang = 'fr', filter = 'all';
try{ lang = localStorage.getItem('lang') || (navigator.language||'fr').slice(0,2)==='en' ? 'en':'fr'; if(localStorage.getItem('lang')) lang=localStorage.getItem('lang'); }catch(e){}
const t = k => T[lang][k];
const L = o => (o && typeof o==='object') ? o[lang] : o;
const hues = [345,15,30,320,0,355,10,335];
const bg = i => `linear-gradient(135deg,hsl(${hues[i%8]} 40% 22%),hsl(${(hues[i%8]+40)%360} 35% 10%))`;
const media = (img,i,alt) => img ? `<img src="${img}" alt="${alt||''}" loading="lazy">` : `<div class="ph" style="background:${bg(i)}">${t('placeholder')}</div>`;

function tile(item,i,mature,extra=''){
  const d = document.createElement('div');
  d.className = 'tile'+(mature?' mature':'')+extra;
  d.innerHTML = media(item.img||item.cover,i,L(item.titre))
    + (mature?`<div class="lock"><b>🔒</b>${t('lock')}</div>`:'')
    + `<div class="cap">${L(item.titre)}<small>${L(item.detail)||''}</small></div>`;
  d.onclick = () => { if(mature && !d.classList.contains('revealed')){d.classList.add('revealed');return;} openLB(item,i); };
  return d;
}

function render(){
  document.documentElement.lang = lang;
  $$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $$('[data-i-html]').forEach(e=>e.innerHTML=t(e.dataset.iHtml));
  $$('[data-iph]').forEach(e=>e.placeholder=t(e.dataset.iph));
  $('#langBtn').textContent = lang==='fr'?'EN':'FR';
  $('#back').textContent = t('back');

  // Séries : filtres + cartes
  $('#seriesChips').innerHTML = '';
  const allChip = chip(t('all'),'all'); $('#seriesChips').append(allChip);
  CONFIG.series.forEach(s=>$('#seriesChips').append(chip(L(s.titre),s.id)));
  const g = $('#gridSeries'); g.innerHTML='';
  if(filter==='all'){
    CONFIG.series.forEach((s,i)=>{
      const n = CONFIG.oeuvres.filter(o=>o.serie===s.id).length;
      const d = tile({titre:s.titre,detail:{fr:n+' œuvres',en:n+' works'},cover:s.cover||(CONFIG.oeuvres.find(o=>o.serie===s.id)||{}).img},i,false);
      d.onclick = () => openSerie(s.id); g.append(d);
    });
  } else {
    CONFIG.oeuvres.filter(o=>o.serie===filter).forEach((o,i)=>g.append(tile(o,i,false)));
  }

  $('#gridSens').innerHTML=''; CONFIG.sensuel.forEach((o,i)=>$('#gridSens').append(tile(o,i+2,true)));
  $('#platforms').innerHTML = CONFIG.plateformes.map(p=>`<a href="${p.url}" target="_blank" rel="noopener">${p.nom} →</a>`).join('');

  $('#shop').innerHTML = CONFIG.boutique.map((p,i)=>`
    <div class="prod ${p.dispo?'':'sold'}"><div class="pic">${media(p.img,i+3,L(p.nom))}</div>
      <div class="body"><h3>${L(p.nom)}</h3><p>${L(p.desc)}</p>
        <div class="row"><span class="price">${p.prix} $</span>
        ${p.dispo?`<a class="btn solid" style="padding:.6rem 1.2rem" href="${p.lien}" target="_blank" rel="noopener">${t('buy')}</a>`:`<span class="btn ghost" style="padding:.6rem 1.2rem">${t('soldout')}</span>`}</div></div></div>`).join('');

  $('#journal').innerHTML = CONFIG.journal.map(e=>`<article class="entry"><time>${L(e.date)}</time><div><h3>${L(e.titre)}</h3><p>${L(e.texte)}</p></div></article>`).join('');
  $('#portrait').innerHTML = CONFIG.portrait ? `<img src="${CONFIG.portrait}" alt="">` : `<div class="ph" style="height:100%;background:${bg(0)}">Portrait</div>`;
  if(!$('#seriePage').hidden) openSerie(currentSerie);
}
function chip(label,id){const b=document.createElement('button');b.className='chip'+(filter===id?' on':'');b.textContent=label;b.onclick=()=>{filter=id;render()};return b}

let currentSerie=null;
function openSerie(id){
  currentSerie=id; const s=CONFIG.series.find(x=>x.id===id);
  $('#sTitle').textContent=L(s.titre); $('#sDesc').textContent=L(s.desc);
  const g=$('#sGrid'); g.innerHTML=''; CONFIG.oeuvres.filter(o=>o.serie===id).forEach((o,i)=>g.append(tile(o,i,false)));
  $('#seriePage').hidden=false; document.body.style.overflow='hidden'; $('#seriePage').scrollTop=0;
}
$('#back').onclick=()=>{$('#seriePage').hidden=true;document.body.style.overflow='';currentSerie=null};

function openLB(item,i){
  $('#lbBox').innerHTML = (item.img?`<img src="${item.img}" alt="">`:`<div class="big" style="background:${bg(i)}">${t('placeholder')}</div>`)+`<p>${L(item.titre)}</p>`;
  $('#lb').classList.add('open');
}
$('#lb').onclick=()=>$('#lb').classList.remove('open');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#lb').classList.remove('open');if(!$('#seriePage').hidden)$('#back').click()}});

/* Langue */
function setLang(l){lang=l;try{localStorage.setItem('lang',l)}catch(e){};render()}
$('#langBtn').onclick=()=>setLang(lang==='fr'?'en':'fr');
$$('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

/* Thème */
function setTheme(th){document.documentElement.dataset.theme=th;$('#themeBtn').textContent=th==='light'?'☀':'☾';try{localStorage.setItem('theme',th)}catch(e){}}
let th='dark'; try{th=localStorage.getItem('theme')||'dark'}catch(e){}
setTheme(th);
$('#themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');

/* Menu mobile */
$('#burger').onclick=()=>$('#mnav').classList.toggle('open');
$$('#mnav a').forEach(a=>a.onclick=()=>$('#mnav').classList.remove('open'));

/* Vérification d'âge */
try{ if(localStorage.getItem('age18')==='1') $('#gate').classList.add('hidden'); }catch(e){}
$('#enter').onclick=()=>{$('#gate').classList.add('hidden');try{localStorage.setItem('age18','1')}catch(e){}};

/* Formulaire → courriel */
$('#cf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);
  location.href=`mailto:${CONFIG.email}?subject=${encodeURIComponent(t('subject'))}&body=${encodeURIComponent(f.get('msg')+'\n\n— '+f.get('nom')+' ('+f.get('courriel')+')')}`};

$('#yr').textContent=new Date().getFullYear();
/* Le contenu éditable vit dans content.json (géré depuis /admin.html) */
fetch('content.json?'+Date.now()).then(r=>r.ok?r.json():null).then(d=>{if(d)Object.assign(CONFIG,d)}).catch(()=>{}).finally(render);
</script>
</body>
</html>
